name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -1d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"

      - name: Verify tag matches app version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/Info.plist)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version does not match app version $app_version"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build release app
        run: |
          xcodebuild build \
            -project SpaceLabeler.xcodeproj \
            -scheme SpaceLabeler \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO

      - name: Package release
        run: |
          mkdir -p dist
          archive="dist/SpaceLabeler-${GITHUB_REF_NAME}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/SpaceLabeler.app \
            "$archive"
          shasum -a 256 "$archive" > "${archive}.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SpaceLabeler-${{ github.ref_name }}.zip
            dist/SpaceLabeler-${{ github.ref_name }}.zip.sha256
